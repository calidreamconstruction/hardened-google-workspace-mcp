name: azani-vps-recovery-probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/azani-vps-recovery-probe.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/azani-vps-recovery-probe.yml
      - azani-vps-recovery-probe.trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY != '' }}
      HAS_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY != '' }}
      HAS_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
      HAS_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
      HAS_VPS_HOST: ${{ secrets.VPS_HOST != '' }}
      HAS_VPS_USER: ${{ secrets.VPS_USER != '' }}
      HAS_TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY != '' }}
      HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN != '' }}
    steps:
      - name: Probe hosted lane and existing VPS control surfaces
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=$RUNNER_NAME os=$RUNNER_OS"
          for name in \
            HAS_VPS_SSH_PRIVATE_KEY HAS_VPS_SSH_KEY HAS_SSH_PRIVATE_KEY \
            HAS_DEPLOY_SSH_KEY HAS_VPS_HOST HAS_VPS_USER \
            HAS_TAILSCALE_AUTHKEY HAS_CLOUDFLARE_API_TOKEN \
            HAS_OPENCLAW_GATEWAY_TOKEN; do
            printf '%s=%s\n' "$name" "${!name}"
          done

          for port in 22 80 443 18789 8765 8000 8080 9000; do
            if timeout 4 bash -c "</dev/tcp/5.78.79.135/$port" 2>/dev/null; then
              echo "vps_tcp_${port}=reachable"
            else
              echo "vps_tcp_${port}=unreachable"
            fi
          done

          for url in \
            http://5.78.79.135:18789/ \
            http://5.78.79.135:18789/health \
            http://5.78.79.135:18789/api/health \
            http://5.78.79.135:8765/health \
            http://5.78.79.135:8765/api/health \
            https://openclaw.calidreamconstruction.com/ \
            https://openclaw.calidreamconstruction.com/health \
            https://openclaw.calidreamconstruction.com/api/health; do
            code=$(curl -ksS --max-time 6 -o /dev/null -w '%{http_code}' "$url" || true)
            printf 'http_probe=%s status=%s\n' "$url" "${code:-000}"
          done
