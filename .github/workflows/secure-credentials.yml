name: secure-credentials

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile secure entrypoints
        run: >-
          python -m py_compile
          auth/secure_credential_store.py
          secure_main.py
          tests/test_secure_credential_store.py
          tests/test_secure_package_contract.py

      - name: Run secure credential and package contracts
        run: |
          python tests/test_secure_credential_store.py -q
          python tests/test_secure_package_contract.py -q
