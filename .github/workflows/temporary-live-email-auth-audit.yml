name: Temporary live email authentication audit

on:
  push:
    branches:
      - ops/live-email-auth-audit-20260723
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install DNS tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils jq

      - name: Audit live email DNS
        shell: bash
        run: |
          set -u
          DOMAIN='calidreamconstruction.com'
          OUT='email-auth-audit.txt'
          : > "$OUT"
          exec > >(tee -a "$OUT") 2>&1

          section() { printf '\n===== %s =====\n' "$1"; }
          query() {
            local type="$1" name="$2"
            printf '\n--- %s %s ---\n' "$type" "$name"
            dig +time=5 +tries=2 +noall +answer "$type" "$name" || true
          }

          section 'metadata'
          date -u '+%Y-%m-%dT%H:%M:%SZ'
          echo "domain=$DOMAIN"

          section 'authoritative DNS and mail routing'
          query NS "$DOMAIN"
          query SOA "$DOMAIN"
          query MX "$DOMAIN"
          query TXT "$DOMAIN"
          query CAA "$DOMAIN"

          section 'DMARC'
          query TXT "_dmarc.$DOMAIN"

          section 'DKIM selectors'
          for selector in google default selector1 selector2 k1 k2 s1 s2 mail email smtp mta mandrill pic pic1 pic2 hs1 hs2 dkim dkim1 dkim2; do
            name="${selector}._domainkey.${DOMAIN}"
            txt="$(dig +time=3 +tries=1 +short TXT "$name" 2>/dev/null || true)"
            cname="$(dig +time=3 +tries=1 +short CNAME "$name" 2>/dev/null || true)"
            if [[ -n "$txt" || -n "$cname" ]]; then
              printf '\n--- selector %s ---\n' "$selector"
              [[ -n "$cname" ]] && printf 'CNAME: %s\n' "$cname"
              [[ -n "$txt" ]] && printf 'TXT: %s\n' "$txt"
            fi
          done

          section 'common sender and tracking subdomains'
          for label in mail email mg smtp reply replies bounce bounces track tracking click links; do
            fqdn="${label}.${DOMAIN}"
            for type in A CNAME MX TXT; do
              value="$(dig +time=3 +tries=1 +short "$type" "$fqdn" 2>/dev/null || true)"
              [[ -n "$value" ]] && printf '%s %s: %s\n' "$type" "$fqdn" "$value"
            done
          done

          section 'transport security'
          query TXT "_mta-sts.$DOMAIN"
          query A "mta-sts.$DOMAIN"
          query CNAME "mta-sts.$DOMAIN"
          query TXT "_smtp._tls.$DOMAIN"

          section 'Google DNS JSON'
          curl --retry 2 --connect-timeout 10 --max-time 30 -fsSL \
            "https://dns.google/resolve?name=${DOMAIN}&type=TXT" | jq . > root-txt.json || true
          curl --retry 2 --connect-timeout 10 --max-time 30 -fsSL \
            "https://dns.google/resolve?name=_dmarc.${DOMAIN}&type=TXT" | jq . > dmarc.json || true
          cat root-txt.json 2>/dev/null || true
          cat dmarc.json 2>/dev/null || true

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: calidreamconstruction-live-email-auth-audit
          path: |
            email-auth-audit.txt
            root-txt.json
            dmarc.json
          if-no-files-found: error
          retention-days: 3
