name: Temporary live email authentication audit

on:
  push:
    branches:
      - ops/live-email-auth-audit-20260723
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install DNS tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils jq

      - name: Audit live email DNS
        shell: bash
        run: |
          set -u
          DOMAIN='calidreamconstruction.com'
          OUT='email-auth-audit.txt'
          : > "$OUT"
          exec > >(tee -a "$OUT") 2>&1

          section() { printf '\n===== %s =====\n' "$1"; }
          query() {
            local type="$1" name="$2"
            printf '\n--- %s %s ---\n' "$type" "$name"
            dig +time=5 +tries=2 +noall +answer "$type" "$name" || true
          }

          section 'metadata'
          date -u '+%Y-%m-%dT%H:%M:%SZ'
          echo "domain=$DOMAIN"

          section 'authoritative DNS and mail routing'
          query NS "$DOMAIN"
          query SOA "$DOMAIN"
          query MX "$DOMAIN"
          query TXT "$DOMAIN"
          query CAA "$DOMAIN"

          section 'SPF dependency records'
          query TXT '_spf.google.com'
          query TXT 'spf.leadconnectorhq.com'
          query TXT '_netblocks.google.com'
          query TXT '_netblocks2.google.com'
          query TXT '_netblocks3.google.com'

          section 'DMARC'
          query TXT "_dmarc.$DOMAIN"

          section 'DKIM selectors'
          for selector in google default selector1 selector2 k1 k2 s1 s2 mail email smtp mta mandrill pic pic1 pic2 hs1 hs2 dkim dkim1 dkim2; do
            name="${selector}._domainkey.${DOMAIN}"
            txt="$(dig +time=3 +tries=1 +short TXT "$name" 2>/dev/null || true)"
            cname="$(dig +time=3 +tries=1 +short CNAME "$name" 2>/dev/null || true)"
            if [[ -n "$txt" || -n "$cname" ]]; then
              printf '\n--- selector %s ---\n' "$selector"
              [[ -n "$cname" ]] && printf 'CNAME: %s\n' "$cname"
              [[ -n "$txt" ]] && printf 'TXT: %s\n' "$txt"
            fi
          done

          section 'common sender and tracking subdomains'
          for label in mail email mg smtp reply replies bounce bounces track tracking click links; do
            fqdn="${label}.${DOMAIN}"
            for type in A CNAME MX TXT; do
              value="$(dig +time=3 +tries=1 +short "$type" "$fqdn" 2>/dev/null || true)"
              [[ -n "$value" ]] && printf '%s %s: %s\n' "$type" "$fqdn" "$value"
            done
          done

          section 'transport security'
          query TXT "_mta-sts.$DOMAIN"
          query A "mta-sts.$DOMAIN"
          query CNAME "mta-sts.$DOMAIN"
          query TXT "_smtp._tls.$DOMAIN"

          section 'Google DNS JSON'
          curl --retry 2 --connect-timeout 10 --max-time 30 -fsSL \
            "https://dns.google/resolve?name=${DOMAIN}&type=TXT" | jq . > root-txt.json || true
          curl --retry 2 --connect-timeout 10 --max-time 30 -fsSL \
            "https://dns.google/resolve?name=_dmarc.${DOMAIN}&type=TXT" | jq . > dmarc.json || true
          cat root-txt.json 2>/dev/null || true
          cat dmarc.json 2>/dev/null || true

      - name: Collect controlled test message headers
        shell: bash
        run: |
          set -u
          INBOX='cdc-auth-20260723-18e2c6f9'
          BASE="https://api.mailinator.com/api/v2/domains/public/inboxes/${INBOX}"
          echo '{"msgs":[]}' > mailinator-inbox.json
          for attempt in $(seq 1 18); do
            curl --retry 2 --connect-timeout 10 --max-time 30 -fsSL \
              "${BASE}?limit=10&sort=descending&decode_subject=true" \
              -o mailinator-inbox.json || true
            if jq -e '.msgs and (.msgs | length > 0)' mailinator-inbox.json >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          cat mailinator-inbox.json
          MESSAGE_ID="$(jq -r '.msgs[0].id // empty' mailinator-inbox.json 2>/dev/null || true)"
          if [[ -n "$MESSAGE_ID" ]]; then
            curl --retry 2 --connect-timeout 10 --max-time 30 -fsSL \
              "${BASE}/messages/${MESSAGE_ID}" \
              -o mailinator-message.json || true
          fi
          [[ -s mailinator-message.json ]] || echo '{"error":"message not retrieved"}' > mailinator-message.json
          jq . mailinator-message.json || cat mailinator-message.json

      - name: Safely normalize DMARC through Cloudflare when authorized
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CF_API_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          set -uo pipefail
          DOMAIN='calidreamconstruction.com'
          RECORD_NAME="_dmarc.${DOMAIN}"
          EXPECTED='v=DMARC1; p=quarantine; rua=mailto:team@calidreamconstruction.com; pct=100'
          DESIRED='v=DMARC1; p=quarantine; rua=mailto:team@calidreamconstruction.com'
          API='https://api.cloudflare.com/client/v4'
          STATUS='cloudflare-dmarc-change.json'
          printf '%s\n' '{"status":"not_started"}' > "$STATUS"

          auth=()
          mode='none'
          if [[ -n "${CF_API_TOKEN:-}" ]]; then
            auth=(-H "Authorization: Bearer ${CF_API_TOKEN}")
            mode='api_token'
          elif [[ -n "${CF_GLOBAL_API_KEY:-}" && -n "${CF_API_EMAIL:-}" ]]; then
            auth=(-H "X-Auth-Key: ${CF_GLOBAL_API_KEY}" -H "X-Auth-Email: ${CF_API_EMAIL}")
            mode='global_api_key'
          else
            jq -n --arg status 'not_changed' --arg reason 'cloudflare_credentials_missing' \
              '{status:$status,reason:$reason}' > "$STATUS"
            cat "$STATUS"
            exit 0
          fi

          zone_response="$(mktemp)"
          if ! curl --retry 2 --connect-timeout 10 --max-time 30 -fsS \
            "${auth[@]}" -H 'Content-Type: application/json' \
            "${API}/zones?name=${DOMAIN}&status=active" -o "$zone_response"; then
            jq -n --arg status 'not_changed' --arg reason 'cloudflare_zone_request_failed' --arg mode "$mode" \
              '{status:$status,reason:$reason,credential_mode:$mode}' > "$STATUS"
            cat "$STATUS"
            exit 0
          fi

          if ! jq -e '.success == true and (.result | length == 1)' "$zone_response" >/dev/null; then
            jq -n --arg status 'not_changed' --arg reason 'cloudflare_credentials_invalid_or_zone_inaccessible' --arg mode "$mode" \
              '{status:$status,reason:$reason,credential_mode:$mode}' > "$STATUS"
            cat "$STATUS"
            exit 0
          fi

          ZONE_ID="$(jq -r '.result[0].id' "$zone_response")"
          record_response="$(mktemp)"
          if ! curl --retry 2 --connect-timeout 10 --max-time 30 -fsS \
            "${auth[@]}" -H 'Content-Type: application/json' \
            "${API}/zones/${ZONE_ID}/dns_records?type=TXT&name=${RECORD_NAME}" -o "$record_response"; then
            jq -n --arg status 'not_changed' --arg reason 'cloudflare_record_request_failed' --arg mode "$mode" \
              '{status:$status,reason:$reason,credential_mode:$mode}' > "$STATUS"
            cat "$STATUS"
            exit 0
          fi

          if ! jq -e '.success == true and (.result | length == 1)' "$record_response" >/dev/null; then
            COUNT="$(jq -r '.result | length // 0' "$record_response" 2>/dev/null || echo 0)"
            jq -n --arg status 'not_changed' --arg reason 'dmarc_record_missing_or_duplicated' --arg mode "$mode" --arg count "$COUNT" \
              '{status:$status,reason:$reason,credential_mode:$mode,record_count:($count|tonumber)}' > "$STATUS"
            cat "$STATUS"
            exit 0
          fi

          RECORD_ID="$(jq -r '.result[0].id' "$record_response")"
          CURRENT="$(jq -r '.result[0].content' "$record_response")"
          if [[ "$CURRENT" == "$DESIRED" ]]; then
            jq -n --arg status 'already_compliant' --arg mode "$mode" --arg current "$CURRENT" \
              '{status:$status,credential_mode:$mode,current:$current}' > "$STATUS"
            cat "$STATUS"
            exit 0
          fi

          if [[ "$CURRENT" != "$EXPECTED" ]]; then
            jq -n --arg status 'not_changed' --arg reason 'unexpected_current_dmarc_value' --arg mode "$mode" --arg current "$CURRENT" --arg desired "$DESIRED" \
              '{status:$status,reason:$reason,credential_mode:$mode,current:$current,desired:$desired}' > "$STATUS"
            cat "$STATUS"
            exit 0
          fi

          payload="$(jq --arg desired "$DESIRED" \
            '.result[0] | {type,name,content:$desired,ttl,proxied,comment,tags} | with_entries(select(.value != null))' \
            "$record_response")"
          patch_response="$(mktemp)"
          if ! curl --retry 2 --connect-timeout 10 --max-time 30 -fsS -X PATCH \
            "${auth[@]}" -H 'Content-Type: application/json' \
            --data "$payload" \
            "${API}/zones/${ZONE_ID}/dns_records/${RECORD_ID}" -o "$patch_response"; then
            jq -n --arg status 'not_changed' --arg reason 'cloudflare_patch_request_failed' --arg mode "$mode" \
              '{status:$status,reason:$reason,credential_mode:$mode}' > "$STATUS"
            cat "$STATUS"
            exit 0
          fi

          if jq -e --arg desired "$DESIRED" '.success == true and .result.content == $desired' "$patch_response" >/dev/null; then
            authoritative="$(dig +time=5 +tries=2 +short TXT "$RECORD_NAME" @pablo.ns.cloudflare.com 2>/dev/null | tr -d '\n' || true)"
            jq -n --arg status 'changed' --arg mode "$mode" --arg previous "$CURRENT" --arg current "$DESIRED" --arg authoritative "$authoritative" \
              '{status:$status,credential_mode:$mode,previous:$previous,current:$current,authoritative_dns:$authoritative}' > "$STATUS"
          else
            jq -n --arg status 'not_changed' --arg reason 'cloudflare_patch_rejected' --arg mode "$mode" \
              '{status:$status,reason:$reason,credential_mode:$mode}' > "$STATUS"
          fi
          cat "$STATUS"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: calidreamconstruction-live-email-auth-audit
          path: |
            email-auth-audit.txt
            root-txt.json
            dmarc.json
            mailinator-inbox.json
            mailinator-message.json
            cloudflare-dmarc-change.json
          if-no-files-found: error
          retention-days: 3
